[package]
name = "jellyfin-strm"
version = "0.1.0"
edition = "2021"
authors = ["spinline"]
description = "Lightweight Rust daemon generating .strm files from Jellyfin media library for direct zero-overhead streaming"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sanitize-filename = "0.5"
anyhow = "1.0"
url = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
